pluginManagement {
    repositories {
        // mavenLocal() is intentionally absent. Build plugins execute code, so
        // resolving them from a mutable local cache first is a supply-chain risk.
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'schematicraft-lib'
