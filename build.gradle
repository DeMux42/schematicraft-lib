plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"
}

// Include the official API client source directly in compilation.
// The API client has zero MC dependencies and is bundled into the lib jar.
// Source of truth: api-clients/java/ (separate public repo).
sourceSets.main.java.srcDir '../../api-clients/java/src'

repositories {
    // mavenLocal() is intentionally absent. It takes precedence over remote
    // repositories, so a stale or poisoned artifact in the local cache would
    // silently enter the build.
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    compileOnly 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// The checks of the code with no Minecraft class in it, as plain programs
// that throw on a failure, so the library takes no test framework.
tasks.register('selfCheck', JavaExec) {
    description = 'Runs the library checks that need no game.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.schematicraft.lib.core.IngameDownloadCheck'
}
tasks.named('check') { dependsOn 'selfCheck' }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
