plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

// NeoForge 26.1 (Minecraft 26.1) runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include the official API client source directly in compilation.
// The API client has zero MC dependencies and is bundled into the lib jar.
// Source of truth: api-clients/java/ (separate public repo)
sourceSets.main.java.srcDir '../../api-clients/java/src'

dependencies {
    compileOnly 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// The checks of the code with no Minecraft class in it, as plain programs
// that throw on a failure, so the library takes no test framework.
tasks.register('selfCheck', JavaExec) {
    description = 'Runs the library checks that need no game.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.schematicraft.lib.core.IngameDownloadCheck'
}
tasks.named('check') { dependsOn 'selfCheck' }

// The library's verification is selfCheck (plain programs that throw), not a
// JUnit suite: src/test holds IngameDownloadCheck's main, not test cases.
// Gradle 9 made the standard `test` task fail when it finds test sources but
// discovers no JUnit tests, so a plain `gradlew build`/`gradlew test` would
// fail here even though selfCheck is green. Opt this module out of that check,
// which keeps `test` a no-op success and leaves selfCheck as the real gate.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
