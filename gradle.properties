# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge
#
# NeoForge 26.1 is Minecraft 26.1 ("1.26"). NeoForge now uses a four-component
# version: the first three identify the Minecraft version (26.1.2) and the last
# the NeoForge build (117). This is the latest stable 26.1.2 release.
#
# 26.1 dropped Mojang's obfuscation, so Parchment mappings are no longer needed
# for parameter names; they are omitted here. The official parameter names come
# from the deobfuscated Minecraft artifact.
minecraft_version=26.1.2
# Deliberately an exact pin, not a range, matching the 1.21.1 build's discipline.
minecraft_version_range=[26.1.2]
neo_version=26.1.2.117

# Mod info
mod_id=schematicraft_lib
mod_name=Schematicraft Lib
mod_license=LGPL-3.0
mod_version=0.1.0
mod_authors=Schematicraft
mod_group_id=com.schematicraft.lib
mod_description=Shared library for Schematicraft editor integrations. Provides API client, library browsing, and UI components.
