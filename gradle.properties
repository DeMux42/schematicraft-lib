# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

# Minecraft / Fabric
# Fabric 1.21.1 keeps the same Minecraft version the NeoForge build already
# supports, so the library's 1.21.1 mappings are reusable and this is a loader
# change, not a loader-and-version change (spec, Pieces table).
minecraft_version=1.21.1

# Yarn mappings. Fabric uses Yarn names, not the official Mojang names the
# deobfuscated NeoForge artifact ships; every mapped type below is a Yarn name.
yarn_mappings=1.21.1+build.3

# Fabric Loader, the lightweight mod loader. Newest stable for 1.21.1.
loader_version=0.19.5

# Fabric API, the version-specific common hooks.
fabric_version=0.116.17+1.21.1

# Mod info
mod_id=schematicraft_lib
mod_name=Schematicraft Lib
mod_license=LGPL-3.0
mod_version=0.1.0
mod_authors=Schematicraft
mod_group_id=com.schematicraft.lib
mod_description=Shared library for Schematicraft editor integrations. Provides API client, library browsing, and UI components.
